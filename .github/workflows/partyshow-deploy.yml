# Tests PartyShow, checks the Docker image, and creates the Hetzner server once.
# After that the server updates itself from this branch every 5 minutes
# (see partyshow/deploy/cloud-init.yaml), so no SSH access is needed.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   HCLOUD_TOKEN    Hetzner Cloud API token (read & write). Without it, only tests run.
#   OPENAI_API_KEY  optional; without it the app uses its demo generator.
#   PARTYSHOW_DOMAIN optional; without it the server gets <ip>.sslip.io.
name: partyshow

on:
  push:
    branches: [ccr-eb46d238-4rfoac]
    paths: ["partyshow/**", ".github/workflows/partyshow-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partyshow-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partyshow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: partyshow/go.mod
          cache-dependency-path: partyshow/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build Docker image
        run: docker build -t partyshow:ci .
      - name: Smoke test the image
        run: |
          docker volume create ci_data
          docker run -d --name ps -p 8080:8080 -v ci_data:/data partyshow:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          # The demo endpoint writes a show to the volume: proves the data dir is writable.
          curl -fsS -X POST localhost:8080/api/demo | grep -q edit_token
          docker logs ps

  provision:
    needs: test
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_NAME: partyshow
    steps:
      - uses: actions/checkout@v4
      - name: Skip without Hetzner token
        id: gate
        run: |
          if [ -z "$HCLOUD_TOKEN" ]; then
            echo "HCLOUD_TOKEN secret not set: nothing to provision."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install hcloud CLI
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz hcloud
          sudo mv hcloud /usr/local/bin/
          hcloud version
      - name: Create server if missing
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PARTYSHOW_DOMAIN: ${{ secrets.PARTYSHOW_DOMAIN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if hcloud server describe "$SERVER_NAME" >/dev/null 2>&1; then
            echo "Server exists; it deploys new commits by itself within 5 minutes."
            hcloud server ip "$SERVER_NAME"
            exit 0
          fi

          # Pick the cheapest available shared x86 type and an EU location.
          TYPES=$(hcloud server-type list -o noheader -o columns=name)
          TYPE=""
          for t in cx23 cx22 cpx11 cpx21; do
            if echo "$TYPES" | grep -qx "$t"; then TYPE=$t; break; fi
          done
          [ -n "$TYPE" ] || { echo "no known server type available"; echo "$TYPES"; exit 1; }
          LOCS=$(hcloud location list -o noheader -o columns=name)
          LOC=""
          for l in nbg1 fsn1 hel1; do
            if echo "$LOCS" | grep -qx "$l"; then LOC=$l; break; fi
          done
          echo "Creating $TYPE in $LOC"

          python3 - <<'PY'
          import os
          s = open("partyshow/deploy/cloud-init.yaml").read()
          for k, v in {
              "__OPENAI_API_KEY__": os.environ.get("OPENAI_API_KEY", ""),
              "__DOMAIN__": os.environ.get("PARTYSHOW_DOMAIN", ""),
              "__DEFAULT_PLAN__": "free",
              "__BRANCH__": os.environ["BRANCH"],
              "__REPO__": os.environ["REPO"],
          }.items():
              s = s.replace(k, v)
          import re
          assert not re.search(r"__[A-Z_]+__", s), "unfilled placeholder"
          open("/tmp/user-data.yaml", "w").write(s)
          PY

          if ! hcloud firewall describe partyshow-web >/dev/null 2>&1; then
            hcloud firewall create --name partyshow-web
            hcloud firewall add-rule partyshow-web --direction in --protocol tcp --port 80 --source-ips 0.0.0.0/0 --source-ips ::/0
            hcloud firewall add-rule partyshow-web --direction in --protocol tcp --port 443 --source-ips 0.0.0.0/0 --source-ips ::/0
          fi

          hcloud server create --name "$SERVER_NAME" --type "$TYPE" --image ubuntu-24.04 \
            --location "$LOC" --firewall partyshow-web --user-data-from-file /tmp/user-data.yaml
          hcloud server enable-backup "$SERVER_NAME" || echo "could not enable Hetzner backups"
          rm -f /tmp/user-data.yaml
          IP=$(hcloud server ip "$SERVER_NAME")
          echo "Server IP: $IP"
          if [ -n "$PARTYSHOW_DOMAIN" ]; then
            echo "Point the DNS A record of $PARTYSHOW_DOMAIN to $IP"
          else
            echo "App will be at https://$(echo "$IP" | tr . -).sslip.io in about 5 minutes"
          fi
