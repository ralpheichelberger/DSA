# Production setup on one Hetzner Cloud server: Caddy (automatic HTTPS) in front of PartyShow.
# Usage on the server: put DOMAIN, BASE_URL, OPENAI_API_KEY ... into deploy/.env, then
#   docker compose up -d --build
# (cloud-init.yaml does this automatically on a new Hetzner server.)
name: partyshow
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  data:
  caddy_data:
