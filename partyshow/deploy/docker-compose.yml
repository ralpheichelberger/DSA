# Production setup on one Hetzner Cloud server: Caddy (automatic HTTPS) in front of PartyShow.
# Usage on the server:  DOMAIN=example.com docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env # OPENAI_API_KEY, BASE_URL=https://$DOMAIN, TRUST_PROXY=true, ...
    volumes:
      - data:/data
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  data:
  caddy_data:
